[project]
name = "lektor"
version = "0.1.0"
description = "Czytanie odpowiedzi Claude Code na głos (Chatterbox PL/EN, MLX)"
requires-python = ">=3.11"
dependencies = [
    "cmudict>=1.1.3",
    "lingua-language-detector>=2.1.1",
    "mlx-audio>=0.5.7",
    "num2words>=0.5.14",
    "numpy>=2.4.6",
    "piper-tts>=1.8.0",
    "sentencepiece>=0.2.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]
